name: React frontend CI/CD with AWS S3

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-publish]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-push-main:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: iv7djc6i
      NEXT_PUBLIC_SANITY_DATASET: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install project dependencies with npm
        run: |
          export NODE_OPTIONS="--max_old_space_size=4196"
          npm install --legacy-peer-deps

      - name: Build production React app
        run: |
          export NODE_OPTIONS="--max_old_space_size=4196"
          npm run build

      - name: Verify blog static pages exist
        run: node scripts/verify-blog-export.mjs

      - name: Upload production build to S3 bucket
        run: |
          aws s3 sync out/ ${{ vars.S3_BUCKET_URI }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths '/*'
        # Blog/article routes need the CloudFront URI rewrite function — see infra/cloudfront-uri-rewrite.js
