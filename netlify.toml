# Netlify build settings (static export).
# Publish directory must match Next.js `output: "export"` (out/).

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NEXT_PUBLIC_SANITY_PROJECT_ID = "iv7djc6i"
  NEXT_PUBLIC_SANITY_DATASET = "production"

# Force brochure PDFs to download (not open) on the deployed site. iOS Safari
# ignores the client-side `download` attribute, so the only reliable fix is
# this server-sent header. Mirrors public/_headers for redundancy.
[[headers]]
  for = "/brochures/*"
  [headers.values]
    Content-Disposition = "attachment"
